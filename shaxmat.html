<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shashka O‘yini</title>
<style>
body{
  margin:0;background:#222;color:#fff;font-family:Arial;
  display:flex;justify-content:center;align-items:center;
  flex-direction:column;min-height:100vh;
}
#menu,#game{
  width:90%;max-width:400px;background:#333;padding:15px;border-radius:12px;text-align:center;
}
.hidden{display:none}
input,select,button{width:100%;padding:10px;margin:6px 0;font-size:18px;border-radius:6px;}
button{background:#4caf50;color:#fff;border:none;cursor:pointer;}
#info{margin-bottom:8px;font-size:18px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:4px solid #111;}
.cell{display:flex;align-items:center;justify-content:center;font-size:calc(22px + 2vmin);user-select:none;}
.white{background:#f0d9b5}
.black{background:#b58863}
.selected{outline:3px solid red}
.move{background:#7fc97f!important}
/* // LOGO STILI */
.logo{width:120px;max-width:60%;margin:0 auto 10px;display:block;}
.logoText{font-size:28px;color:#4caf50;margin-bottom:10px;font-weight:bold;}
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<div id="menu">

  <!-- // LOGO (rasm bo‘lsa) -->
  <img src="logo.png" class="logo">
  <!-- // AGAR RASM YO‘Q BO‘LSA, MATN LOGO -->
  <!-- <div class="logoText">♟️ SHASHKA PRO</div> -->

  <input id="p1" placeholder="1-o‘yinchi">
  <input id="p2" placeholder="2-o‘yinchi / AI">

  <select id="mode">
    <option value="pvp">Odam vs Odam</option> <!-- // Multiplayer -->
    <option value="ai">Odam vs AI</option>     <!-- // AI -->
  </select>

  <button onclick="start()">Boshlash</button>

  <!-- // ALOQA RAQAMI -->
  <p style="margin-top:10px;font-size:14px;color:#ccc">
    Savollar uchun: <b>94 661 2013</b>
  </p>
</div>

<!-- ================= O‘YIN ================= -->
<div id="game" class="hidden">
  <div id="info"></div>
  <button onclick="undo()">⏪ Orqaga olish</button>
  <div class="board" id="board"></div>
</div>

<script>
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const boardEl=document.getElementById("board");
const info=document.getElementById("info");

let turn="w", selected=null, moves=[], history=[];
let mode="pvp"; // // DEFAULT MODE

// // SHASHKA DOSKASI
let board=[
 ["","b","","b","","b","","b"],
 ["b","","b","","b","","b",""],
 ["","b","","b","","b","","b"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["w","","w","","w","","w",""],
 ["","w","","w","","w","","w"],
 ["w","","w","","w","","w",""]
];

function start(){
  const in1=document.getElementById("p1").value;
  const in2=document.getElementById("p2").value;
  p1=in1||"Oq";
  p2=in2||"Qora";
  mode=document.getElementById("mode").value; // // Tanlangan rejim
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  draw();
  if(mode==="ai" && turn==="b") setTimeout(aiMove,400);
}

function draw(){
  boardEl.innerHTML="";
  info.textContent=(turn==="w"?p1:p2)+" yurmoqda";

  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++){
      let d=document.createElement("div");
      d.className="cell "+((r+c)%2?"black":"white");
      let v=board[r][c];
      d.textContent=v==="w"?"⚪":v==="b"?"⚫":v==="W"?"👑":v==="B"?"👑":"";
      d.onclick=()=>clickCell(r,c);
      boardEl.appendChild(d);
    }
}

function save(){
  history.push(JSON.parse(JSON.stringify(board)));
}

function undo(){
  if(!history.length) return;
  board=history.pop();
  turn=turn==="w"?"b":"w";
  draw();
}

function clickCell(r,c){
  clear();
  if(selected){
    for(let m of moves){
      if(m[0]==r && m[1]==c){
        save();
        board[r][c]=board[selected[0]][selected[1]];
        board[selected[0]][selected[1]]="";
        if(m.length===4) board[m[2]][m[3]]="";
        king(r,c);
        selected=null;
        turn=turn==="w"?"b":"w";
        draw();
        if(mode==="ai" && turn==="b") setTimeout(aiMove,400);
        return;
      }
    }
  }

  let v=board[r][c];
  if(!v) return;
  if(turn==="w"&&(v==="w"||v==="W")||turn==="b"&&(v==="b"||v==="B")){
    selected=[r,c];
    moves=calcMoves(r,c,v);
    mark();
  }
}

// // ORQAGA OLISH + DAMA
function calcMoves(r,c,p){
  const res=[], cap=[];
  const enemy=p.toLowerCase()==="w"?["b","B"]:["w","W"];
  const dirs=[];
  if(p==="w") dirs.push([-1,-1],[-1,1]);
  if(p==="b") dirs.push([1,-1],[1,1]);
  if(p==="W"||p==="B") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);

  dirs.forEach(d=>{
    let r1=r+d[0],c1=c+d[1],r2=r+d[0]*2,c2=c+d[1]*2;
    if(enemy.includes(board[r1]?.[c1])&&board[r2]?.[c2]==="")
      cap.push([r2,c2,r1,c1]);
  });
  if(cap.length) return cap;

  dirs.forEach(d=>{
    if(board[r+d[0]]?.[c+d[1]]==="")
      res.push([r+d[0],c+d[1]]);
  });
  return res;
}

function king(r,c){
  if(board[r][c]==="w" && r===0) board[r][c]="W";
  if(board[r][c]==="b" && r===7) board[r][c]="B";
}

function aiMove(){
  let all=[];
  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++)
      if(board[r][c]==="b"||board[r][c]==="B")
        calcMoves(r,c,board[r][c]).forEach(m=>all.push([r,c,...m]));
  if(!all.length) return;
  let m=all[Math.floor(Math.random()*all.length)];
  save();
  board[m[2]][m[3]]=board[m[0]][m[1]];
  board[m[0]][m[1]]="";
  if(m.length===6) board[m[4]][m[5]]="";
  king(m[2],m[3]);
  turn="w";
  draw();
}

function mark(){
  document.querySelectorAll(".cell").forEach((c,i)=>{
    let r=Math.floor(i/8),co=i%8;
    if(selected&&r==selected[0]&&co==selected[1]) c.classList.add("selected");
    moves.forEach(m=>{if(m[0]==r&&m[1]==co) c.classList.add("move")});
  });
}
function clear(){
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("selected","move"));
}
</script>

</body>
</html>
