<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shashka O‘yini</title>
<style>
body{
  margin:0;background:#222;color:#fff;
  font-family:Arial;display:flex;justify-content:center;align-items:center;
  flex-direction:column;
  min-height:100vh;
}
#menu, #game{
  width:90%; max-width:400px; text-align:center; margin:10px auto;
  background:#333;padding:15px;border-radius:12px;
}
#menu input,#menu select,#menu button{
  width:100%;margin:6px 0;padding:10px;font-size:18px;
  border-radius:6px;
}
#menu button{background:#4caf50;border:none;color:#fff;cursor:pointer}
#info{margin-bottom:8px;font-size:18px;}
.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  aspect-ratio:1;
  border:4px solid #333;
}
.cell{
  width:100%;height:100%;
  display:flex;justify-content:center;align-items:center;
  font-size:calc(20px + 2vmin);
  cursor:pointer;user-select:none;
}
.white{background:#f0d9b5}
.black{background:#b58863}
.selected{outline:3px solid red}
.move{background:#7fc97f!important}
button{font-size:18px;padding:8px;margin-top:5px;border-radius:6px;}
</style>
</head>
<body>

<div id="menu">
  <h2>Shashka o‘yini</h2>
  <input id="p1" placeholder="1-o‘yinchi">
  <input id="p2" placeholder="2-o‘yinchi / AI">
  <select id="mode">
    <option value="pvp">Odam vs Odam</option>
    <option value="ai">Odam vs AI</option>
  </select>
  <button onclick="start()">Boshlash</button>
</div>

<div id="game" class="hidden">
  <div id="info"></div>
  <button onclick="undo()">⏪ Orqaga qaytish</button>
  <div class="board" id="board"></div>
</div>

<script>
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const boardEl=document.getElementById("board");
const info=document.getElementById("info");

let p1="O‘yinchi 1", p2="O‘yinchi 2";
let mode="pvp";
let turn="w", selected=null, moves=[];
let history=[];

/* ===== SHASHKA ===== */
let checkersBoard=[
 ["","b","","b","","b","","b"],
 ["b","","b","","b","","b",""],
 ["","b","","b","","b","","b"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["w","","w","","w","","w",""],
 ["","w","","w","","w","","w"],
 ["w","","w","","w","","w",""]
];

function start(){
  let in1=document.getElementById("p1").value;
  let in2=document.getElementById("p2").value;
  p1=in1||p1; p2=in2||p2;
  mode=document.getElementById("mode").value;
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  draw();
  checkWinner();
  if(mode==="ai" && turn==="b") setTimeout(aiMove,400);
}

function draw(){
  boardEl.innerHTML="";
  info.textContent=(turn==="w"?p1:p2)+" yurmoqda";
  let b=checkersBoard;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const cell=document.createElement("div");
      cell.className="cell "+((r+c)%2?"black":"white");
      let v=b[r][c];
      cell.textContent=v==="w"?"⚪":v==="b"?"⚫":v==="W"?"👑":v==="B"?"👑":"";
      cell.onclick=()=>clickCell(r,c);
      boardEl.appendChild(cell);
    }
  }
}

function saveState(){
  history.push({board:JSON.parse(JSON.stringify(checkersBoard)), turn:turn});
}

function clickCell(r,c){
  clear();
  let b=checkersBoard;

  if(selected){
    for(let m of moves){
      if(m[0]==r && m[1]==c){
        saveState();
        b[r][c]=b[selected[0]][selected[1]];
        b[selected[0]][selected[1]]="";
        if(m.length===4) b[m[2]][m[3]]="";
        makeKing(r,c);
        selected=null;
        turn=turn==="w"?"b":"w";
        draw();
        checkWinner();
        if(mode==="ai" && turn==="b") setTimeout(aiMove,400);
        return;
      }
    }
  }

  let v=b[r][c];
  if(!v) return;
  if(turn==="w"&&(v==="w"||v==="W")||turn==="b"&&(v==="b"||v==="B")){
    selected=[r,c];
    moves=checkersMoves(r,c,v);
    mark();
  }
}

function checkersMoves(r,c,p){
  const res=[], cap=[];
  const enemy = p.toLowerCase()==="w"?["b","B"]:["w","W"];
  const dirs = [];
  if(p==="w") dirs.push([-1,-1],[-1,1]);
  if(p==="b") dirs.push([1,-1],[1,1]);
  if(p==="W"||p==="B") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);

  dirs.forEach(d=>{
    let r1=r+d[0], c1=c+d[1], r2=r+d[0]*2, c2=c+d[1]*2;
    if(enemy.includes(checkersBoard[r1]?.[c1]) && checkersBoard[r2]?.[c2]==="")
      cap.push([r2,c2,r1,c1]);
  });
  if(cap.length) return cap;
  dirs.forEach(d=>{
    if(checkersBoard[r+d[0]]?.[c+d[1]]==="")
      res.push([r+d[0],c+d[1]]);
  });
  return res;
}

function makeKing(r,c){
  if(checkersBoard[r][c]==="w" && r===0) checkersBoard[r][c]="W";
  if(checkersBoard[r][c]==="b" && r===7) checkersBoard[r][c]="B";
}

function undo(){
  if(!history.length) return;
  let last=history.pop();
  checkersBoard=JSON.parse(JSON.stringify(last.board));
  turn=last.turn;
  selected=null;
  draw();
}

function mark(){
  document.querySelectorAll(".cell").forEach((c,i)=>{
    let r=Math.floor(i/8), col=i%8;
    if(selected&&r==selected[0]&&col==selected[1]) c.classList.add("selected");
    moves.forEach(m=>{if(m[0]==r&&m[1]==col) c.classList.add("move")});
  });
}

function clear(){
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("selected","move"));
}

function aiMove(){
  let all=[];
  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++){
      let v=checkersBoard[r][c];
      if(turn==="b"&&(v==="b"||v==="B")){
        let m=checkersMoves(r,c,v);
        m.forEach(x=>all.push([r,c,...x]));
      }
    }
  if(!all.length) return;
  let m=all[Math.floor(Math.random()*all.length)];
  saveState();
  checkersBoard[m[2]][m[3]]=checkersBoard[m[0]][m[1]];
  checkersBoard[m[0]][m[1]]="";
  if(m.length===6) checkersBoard[m[4]][m[5]]="";
  makeKing(m[2],m[3]);
  turn="w";
  draw();
  checkWinner();
}

function checkWinner(){
  let w=false, b=false;
  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++){
      if(checkersBoard[r][c]=="w"||checkersBoard[r][c]=="W") w=true;
      if(checkersBoard[r][c]=="b"||checkersBoard[r][c]=="B") b=true;
    }
  if(!w) {alert("Qora g‘alaba!"); reset(); return;}
  if(!b) {alert("Oq g‘alaba!"); reset(); return;}
}

function reset(){
  checkersBoard=[
   ["","b","","b","","b","","b"],
   ["b","","b","","b","","b",""],
   ["","b","","b","","b","","b"],
   ["","","","","","","",""],
   ["","","","","","","",""],
   ["w","","w","","w","","w",""],
   ["","w","","w","","w","","w"],
   ["w","","w","","w","","w",""]
  ];
  turn="w";
  history=[];
  draw();
}
</script>

</body>
</html>
